# Default values for helm-chart-deployment.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: asx-jfux-docker.artifactrepo.kenvue.com/asx-jfux-docker/rdx-sip-ui-mf
  pullPolicy: Always
  tag: latest # Change this to your specific image tag ..
imagePullSecrets:
  - name: sip-nexus-cred-new
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  {}
  # fsGroup: 2000

securityContext:
  {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80
  targetPort: 80
  selector:
    app: rdx-sip-ui-mf

ingress:
  enabled: false
  className: "sip-ingress"
  annotations:
    {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: sip.kenvue.com
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

livenessProbe:
  httpGet:
    path: /
    port: http
readinessProbe:
  httpGet:
    path: /
    port: http

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

env:
  - name: BASE_URL
    key: BASE_URL
  - name: CONSUMER_SYSTEM
    key: CONSUMER_SYSTEM
  - name: REACT_APP_API_BASE_URL
    key: REACT_APP_API_BASE_URL
  - name: REACT_APP_UI_API_BASE_URL
    key: REACT_APP_UI_API_BASE_URL
  - name: GA_TAG_ID
    key: GA_TAG_ID

# Additional volumes on the output Deployment definition.
volumes:
  - name: sip-dev-configmap
    configMap:
      name: sip-dev-config
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts:
  - name: sip-dev-configmap
    mountPath: "/etc/sipconfig"
    readOnly: true
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}
